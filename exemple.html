<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Word Cloud Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.1/wordcloud2.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        #cloud { width: 600px; height: 400px; border: 1px solid #ccc; margin-top: 20px; }
        textarea { width: 100%; height: 120px; }
    </style>
</head>
<body>

<h2>Word Cloud Generator</h2>

<textarea id="inputText" placeholder="Type or paste text here..."></textarea><br>
<button onclick="generateCloud()">Generate Word Cloud</button>

<div id="cloud"></div>

<script>
function generateCloud() {
    let text = document.getElementById("inputText").value;

    // nettoyer
    text = text.toLowerCase().replace(/[^\w\s]/g, "");

    // découper en mots
    let words = text.split(/\s+/);

    // compter
    let freqMap = {};
    words.forEach(word => {
        if (word.length > 0) {
            freqMap[word] = (freqMap[word] || 0) + 1;
        }
    });

    // transformer pour WordCloud2.js
    let list = Object.entries(freqMap); // [["mot", 3], ["exemple", 10], ...]

    WordCloud(document.getElementById("cloud"), {
        list: list,
        weightFactor: 10, // taille de base
        backgroundColor: "#f5f5f5"
    });
}
</script>

</body>
</html>
