<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimbusWords - Application de nuage de mot </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.1/wordcloud2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> </head>

<body>
    <div class="app-container">
        <header>
            <div class="icone-parametres">
                <i class="fa-solid fa-gear"></i>
            </div>
            <div>
                <img src="../data/images/logo.png" alt="Nimbus Words Logo" class="logo-image">
            </div>
        </header>

        <main>
            <div class="conteneur-saisie">
                <div class="boite-saisie-texte box-style">
                    <textarea id="saisie-texte" placeholder="Entrez votre texte ici" rows="10"></textarea>
                </div>

                <div class="groupe-actions-saisie">
                    <input type="file" id="telechargement-fichier" accept=".txt" style="display: none;">
                    <button id="btn-importer" class="btn-importer">
                        <div class="icone-nuage">☁️</div> importer
                    </button>
                    <div class="format-accepte">format acceptés : **.txt**</div>
                </div>

                <button class="btn-generer">Générer</button>
            </div>

            <div class="conteneur-resultat">
                <div class="boite-resultat box-style"> </div>
            </div>
        </main>
        
        <div class="icone-aide">?</div>
    </div>

    <footer> Projet Hypermedia - Chloe Makoundou Master 1 IBD</footer>
    
    <script src="js/script.js"></script> 
</body>
</html>
