<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimbusWords - Application de nuage de mots</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(180deg, #A8E6F0 0%, #87CEEB 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            flex: 1;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        .icone-parametres {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .icone-parametres:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .icone-parametres i {
            font-size: 32px;
            color: #87CEEB;
        }

        .logo-image {
            max-width: 200px;
            height: auto;
        }

        main {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }

        .conteneur-saisie {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .conteneur-resultat {
            flex: 1.5;
        }

        .box-style {
            background: white;
            border: 4px solid #00BFFF;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .boite-saisie-texte {
            min-height: 350px;
        }

        .boite-saisie-texte::before {
            content: 'Entrez votre texte ici';
            display: block;
            color: #00BFFF;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #saisie-texte {
            width: 100%;
            height: 280px;
            border: none;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }

        .groupe-actions-saisie {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #00BFFF;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 191, 255, 0.3);
        }

        .btn-primary:hover {
            background: #0099CC;
            transform: translateY(-2px);
        }

        .format-accepte {
            color: #00BFFF;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-generer {
            background: #00BFFF;
            color: white;
            border: none;
            padding: 15px 60px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 191, 255, 0.4);
            align-self: flex-start;
            transition: all 0.3s ease;
        }

        .btn-generer:hover {
            background: #0099CC;
            transform: translateY(-2px);
        }

        .boite-resultat {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 18px;
        }

        .icone-aide {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: #00BFFF;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 191, 255, 0.4);
            transition: all 0.3s ease;
        }

        .icone-aide:hover {
            background: #0099CC;
            transform: scale(1.1);
        }

        footer {
            background: rgba(255, 255, 255, 0.3);
            padding: 15px;
            text-align: center;
            color: #0099CC;
            font-size: 14px;
            font-weight: bold;
        }

        @media (max-width: 968px) {
            main {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="icone-parametres">
                <i class="fa-solid fa-gear"></i>
            </div>
            <div>
                <svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
                    <!-- Nuage -->
                    <ellipse cx="100" cy="40" rx="45" ry="30" fill="white"/>
                    <ellipse cx="75" cy="35" rx="30" ry="25" fill="white"/>
                    <ellipse cx="125" cy="35" rx="30" ry="25" fill="white"/>
                    
                    <!-- Texte -->
                    <text x="100" y="35" font-family="Comic Sans MS, sans-serif" font-size="16" font-weight="bold" fill="#00BFFF" text-anchor="middle">Nimbus</text>
                    <text x="100" y="50" font-family="Comic Sans MS, sans-serif" font-size="16" font-weight="bold" fill="#00BFFF" text-anchor="middle">Words</text>
                </svg>
            </div>
        </header>

        <main>
            <div class="conteneur-saisie">
                <div class="boite-saisie-texte box-style">
                    <textarea id="saisie-texte" placeholder="Tapez votre texte ici..." rows="10"></textarea>
                </div>
                
                <input type="file" id="telechargement-fichier" accept=".txt" style="display: none;">
                <div class="groupe-actions-saisie">
                    <button id="btn-importer" class="btn btn-primary">☁️ importer</button>
                    <div class="format-accepte">format acceptés : .txt</div>
                </div>

                <button class="btn-generer">Générer</button>
            </div>

            <div class="conteneur-resultat">
                <div class="boite-resultat box-style">Votre nuage de mots apparaîtra ici</div>
            </div>
        </main>
        
        <div class="icone-aide">?</div>
    </div>

    <footer>Projet Hypermedia - Chloe Makoundou Master 1 IBD</footer>
    
    <script>
        // Bouton importer
        document.querySelector('#btn-importer').addEventListener('click', function() {
            document.querySelector('#telechargement-fichier').click();
        });

        document.querySelector('#telechargement-fichier').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.querySelector('#saisie-texte').value = event.target.result;
                };
                reader.readAsText(file);
            }
        });

        // Bouton générer
        document.querySelector('.btn-generer').addEventListener('click', function() {
            const text = document.querySelector('#saisie-texte').value;
            if (text.trim()) {
                alert('Génération du nuage de mots en cours...');
                // Ici vous pourrez ajouter la logique de génération du nuage de mots
            } else {
                alert('Veuillez entrer du texte ou importer un fichier !');
            }
        });

        // Icône aide
        document.querySelector('.icone-aide').addEventListener('click', function() {
            alert('Aide:\n\n1. Entrez votre texte dans la zone de gauche\n2. Ou importez un fichier .txt\n3. Cliquez sur "Générer" pour créer votre nuage de mots');
        });

        // Icône paramètres
        document.querySelector('.icone-parametres').addEventListener('click', function() {
            alert('Paramètres à venir...');
        });
    </script>
</body>
</html>
